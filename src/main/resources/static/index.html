<!DOCTYPE html>
<html lang="en">

    <!-- HEADER -->
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Items</title>
        <link rel="stylesheet" href="/simple.css">
    </head>

    <!-- BODY -->
    <body>
        <main>
            <h1>Items</h1>
            <button id="add-button" type="button">Add item</button>

            <!-- List view: app.js fills item-rows from GET /items -->
            <table>
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="item-rows"></tbody>
            </table>

            <p id="empty-message" hidden>No items yet, click "Add item".</p>
        </main>

        <script src="/app.js"></script>
    </body>

</html>
