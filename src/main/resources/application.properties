spring.application.name=rest-api-template

# Port is deliberate and fixed: 8090 everywhere, native and future containers.
server.port=8090

# Make only local processes to react the app
server.address=127.0.0.1

# Show every SQL statement Hibernate runs, in the bootRun console.
spring.jpa.show-sql=true

# Schema is versioned code: Flyway runs the migrations in db/migration,
# so Hibernate only validates the schema against the entities.
spring.jpa.hibernate.ddl-auto=validate

# Keep database access inside the request transaction: disables the OSIV
# pattern where a connection is held open for the whole view rendering.
spring.jpa.open-in-view=false

# Finnishing the shutdown instead of dropping.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Error bodies stay minimal in every run mode, no stacktraces offered.
spring.web.error.include-stacktrace=never

# Health probe for container healthchecks
management.endpoints.web.exposure.include=health

# Hiding /actuator link page, health answers at /actuator/health
management.endpoints.web.discovery.enabled=false
